[project]
name = "ai-job-hunter"
version = "0.1.0"
description = "Private, cost-conscious AI job-search and application-preparation assistant"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "reportlab>=4.2,<5.0",
    "python-multipart>=0.0.9,<1.0",
    "itsdangerous>=2.2,<3.0",
    "google-genai>=1.0,<2.0",
    "pypdfium2>=4.30,<6",
    "truststore>=0.9,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4.0"]
browser = ["playwright>=1.48,<2.0"]
dev = ["pytest>=8.0,<9.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
