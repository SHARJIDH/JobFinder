# Job-search settings. Edit from the dashboard (Settings) or in data/search.yaml.
#
# Source providers (each verified reachable on 2026-10-27; robots.txt is evaluated per RFC 9309 on every request):
#   greenhouse      — public Job Board API (boards-api.greenhouse.io), documented.          board = token
#   lever           — public Postings API (api.lever.co/v0/postings), documented.           board = token
#   ashby           — public Posting API (api.ashbyhq.com/posting-api), documented.         board = token
#   workday         — JSON used by the company's own career site.                          board = "host|tenant|site"
#   eightfold       — /api/pcsx, explicitly Allowed in the site's robots.txt (Microsoft, Qualcomm). board = "host|domain"
#   amazon          — amazon.jobs search JSON (robots.txt only disallows /internal).        board = ISO-3 country code
#   atlassian       — Atlassian's careers listings JSON (full list → closures detected).   board = any label
#   oracle          — Oracle Recruiting Cloud candidate REST API.                           board = "host|siteNumber|locationId"
#   google          — Google Careers results page, newest first; page 1 only (robots.txt disallows ?page=). board = location
#   sitemap         — company sitemap + schema.org JobPosting on each job page (Intuit).    board = "sitemap_url|url_regex"
#   smartrecruiters — documented API, but its robots.txt disallows generic agents → disabled by default.
#
# Web search (see `web_search` below): Gemini + Grounding with Google Search, restricted to each company's
# `official_domains`. By default it runs only for companies with no enabled feed (Uber, Walmart, ServiceNow…).
# Results whose official page is readable become verified postings; others are stored as "web leads"
# (never ranked until you paste the description from the official page).

companies:
  # ---- Initial watchlist ----
  - name: Google
    priority: 1
    careers_url: https://www.google.com/about/careers/applications/jobs/results/?location=India&q=software%20engineer
    official_domains: [google.com]
    sources:
      - {provider: google, board: India, search_terms: ["software engineer", "backend", "full stack", "machine learning", "AI engineer"]}
  - name: Microsoft
    priority: 1
    careers_url: https://apply.careers.microsoft.com/careers?query=software%20engineer&location=India
    official_domains: [apply.careers.microsoft.com, careers.microsoft.com, jobs.careers.microsoft.com]
    sources:
      - {provider: eightfold, board: "apply.careers.microsoft.com|microsoft.com", search_terms: ["software engineer", "machine learning", "AI engineer"]}
  - name: Amazon
    priority: 1
    careers_url: https://www.amazon.jobs/en/search?base_query=software+development+engineer&country=IND
    official_domains: [amazon.jobs]
    sources:
      - {provider: amazon, board: IND, search_terms: ["software development engineer", "machine learning engineer", "applied scientist"]}
  - name: Adobe
    priority: 1
    careers_url: https://adobe.wd5.myworkdayjobs.com/external_experienced
    official_domains: [adobe.wd5.myworkdayjobs.com, careers.adobe.com]
    sources:
      - {provider: workday, board: "adobe.wd5.myworkdayjobs.com|adobe|external_experienced", search_terms: ["software engineer", "machine learning", "developer"]}
  - name: NVIDIA
    priority: 1
    careers_url: https://nvidia.wd5.myworkdayjobs.com/NVIDIAExternalCareerSite
    official_domains: [nvidia.wd5.myworkdayjobs.com]
    sources:
      - {provider: workday, board: "nvidia.wd5.myworkdayjobs.com|nvidia|NVIDIAExternalCareerSite", search_terms: ["software engineer", "machine learning", "AI engineer"]}
  - name: Salesforce
    priority: 1
    careers_url: https://salesforce.wd12.myworkdayjobs.com/External_Career_Site
    official_domains: [salesforce.wd12.myworkdayjobs.com, careers.salesforce.com]
    sources:
      - {provider: workday, board: "salesforce.wd12.myworkdayjobs.com|salesforce|External_Career_Site", search_terms: ["software engineer", "AI engineer"]}
  - name: Uber
    priority: 1
    careers_url: https://www.uber.com/global/en/careers/list/?location=IND
    official_domains: [uber.com]
    notes: No public job API found; covered by web search.
  - name: Atlassian
    priority: 1
    careers_url: https://www.atlassian.com/company/careers/all-jobs?location=India
    official_domains: [atlassian.com]
    sources:
      - {provider: atlassian, board: atlassian}
  - name: ServiceNow
    priority: 1
    careers_url: https://careers.servicenow.com/jobs/?location=India
    official_domains: [careers.servicenow.com, jobs.smartrecruiters.com]
    sources:
      - {provider: smartrecruiters, board: ServiceNow, enabled: false, notes: "robots.txt disallows generic agents; enable at your discretion"}
    notes: Covered by web search while the SmartRecruiters feed is disabled.
  - name: Oracle
    priority: 2
    careers_url: https://careers.oracle.com/jobs/#en/sites/jobsearch/requisitions?location=India
    official_domains: [careers.oracle.com, eeho.fa.us2.oraclecloud.com]
    sources:
      - {provider: oracle, board: "eeho.fa.us2.oraclecloud.com|CX_45001|300000000106947", search_terms: ["software engineer", "developer", "machine learning"]}
  - name: Intuit
    priority: 1
    careers_url: https://jobs.intuit.com/search-jobs/India
    official_domains: [jobs.intuit.com]
    sources:
      - {provider: sitemap, board: "https://jobs.intuit.com/sitemap.xml|/job/(bengaluru|bangalore|hyderabad|pune|chennai|gurugram|gurgaon|noida|mumbai|india)/"}
  - name: Qualcomm
    priority: 2
    careers_url: https://careers.qualcomm.com/careers?location=India
    official_domains: [careers.qualcomm.com]
    sources:
      - {provider: eightfold, board: "careers.qualcomm.com|qualcomm.com", search_terms: ["software engineer", "machine learning"]}
  - name: Cisco
    priority: 1
    careers_url: https://jobs.cisco.com/jobs/SearchJobs/?21178=%5B169482%5D
    official_domains: [cisco.wd5.myworkdayjobs.com, jobs.cisco.com, careers.cisco.com]
    sources:
      - {provider: workday, board: "cisco.wd5.myworkdayjobs.com|cisco|Cisco_Careers", search_terms: ["software engineer", "AI engineer"]}
  - name: Walmart Global Tech
    priority: 1
    careers_url: https://careers.walmart.com/results?q=software%20engineer&jobCountry=IN
    official_domains: [careers.walmart.com]
    notes: Search API disallowed by robots.txt; covered by web search.

  # ---- Comparable product companies with verified public ATS boards and India roles ----
  - {name: Databricks, priority: 1, sources: [{provider: greenhouse, board: databricks}]}
