roles:
  - {name: Software Engineer, priority: primary, keywords: ["software engineer", "software development engineer", "software developer", "member of technical staff", "mts", "sde", "swe", "developer"]}
  - {name: Backend Engineer, priority: primary, keywords: ["backend", "back end", "server side", "api engineer", "distributed systems"]}
  - {name: Full-Stack Engineer, priority: primary, keywords: ["full stack", "fullstack", "full-stack"]}
  - {name: AI Engineer, priority: primary, keywords: ["ai engineer", "applied ai", "genai", "generative ai", "llm", "agentic", "ai/ml", "applied scientist"]}
  - {name: Machine Learning Engineer, priority: primary, keywords: ["machine learning", "ml engineer", "mlops"]}
  - {name: Frontend Engineer, priority: secondary, keywords: ["frontend", "front end", "front-end", "ui engineer", "web engineer"]}
  - {name: Platform Engineer, priority: secondary, keywords: ["platform engineer", "cloud engineer", "infrastructure engineer", "site reliability", "sre", "devops"]}

exclude_title_keywords: [director, vice president, head of, intern, internship, sales, account executive, recruiter]

locations:
  preferred_cities: [Hyderabad, Bengaluru, Pune, Chennai, Gurugram, Noida]
  home_country: India
  allow_other_home_country_cities: true
  allow_remote: true
  remote_regions_eligible: [India, APAC, Asia, Worldwide, Anywhere, Global]
  international_eligible_countries: []   # add countries where you are authorised to work

compensation:
  target_annual_lpa: 30
  fx_to_inr: {USD: 84.0, EUR: 91.0, GBP: 107.0, SGD: 63.0, CAD: 61.0, AUD: 55.0}

freshness:
  preferred_hours: 72
  max_age_days: 60

weights:
  skills: 0.30
  role_fit: 0.20
  experience: 0.15
  compensation: 0.08
  company: 0.07
  location: 0.12
  freshness: 0.08
  required_skill_share: 0.75
  ai_weight: 0.35

tiers: {a: 78, b: 65, c: 50}

experience:
  hard_exclude_years_gap: 4

limits:
  max_ai_scores_per_run: 25
  ai_score_min_deterministic: 55
  auto_tailor_per_run: 3
  auto_tailor_min_tier: A
  notify_max_jobs: 10
  notify_min_tier: B
  workday_max_details_per_company: 40

# Gemini + Grounding with Google Search (needs LLM_PROVIDER=gemini). Counts against the daily
# LLM call/spend caps in .env; each grounded query is priced via PRICE_GROUNDED_PROMPT_USD.
web_search:
  enabled: true
  scope: no_feed              # no_feed = only companies without an enabled feed; all = every company with official_domains
  max_queries_per_run: 12
  max_page_fetches_per_run: 30
