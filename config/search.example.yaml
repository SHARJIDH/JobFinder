  - {name: Rubrik, priority: 2, sources: [{provider: greenhouse, board: rubrik}]}
  - {name: GitLab, priority: 2, sources: [{provider: greenhouse, board: gitlab}]}
  - {name: Elastic, priority: 2, sources: [{provider: greenhouse, board: elastic}]}
  - {name: Datadog, priority: 2, sources: [{provider: greenhouse, board: datadog}]}
  - {name: Twilio, priority: 2, sources: [{provider: greenhouse, board: twilio}]}
  - {name: Coinbase, priority: 2, sources: [{provider: greenhouse, board: coinbase}]}
  - {name: Airbnb, priority: 2, sources: [{provider: greenhouse, board: airbnb}]}
  - {name: Groww, priority: 3, sources: [{provider: greenhouse, board: groww}]}
  - {name: Palantir, priority: 2, sources: [{provider: lever, board: palantir}]}
  - {name: Meesho, priority: 3, sources: [{provider: lever, board: meesho}]}
  - {name: Zeta, priority: 3, sources: [{provider: lever, board: zeta}]}
